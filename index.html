<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catraca do Skatepark</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        /* CSS Moderno e Limpo */
        :root {
            --cor-neutra: #e9ecef;
            --cor-liberado: #28a745;
            --cor-negado: #dc3545;
            --cor-texto: #343a40;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cor-neutra);
            color: var(--cor-texto);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        body.acesso-liberado { background-color: var(--cor-liberado); }
        body.acesso-negado { background-color: var(--cor-negado); }

        /* Cartão Central */
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { color: #6c757d; margin-bottom: 30px; }

        /* Estilo do Botão de Upload */
        input[type="file"] { display: none; }
        
        .btn-upload {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .btn-upload:hover { background-color: #0056b3; }

        /* Container da Imagem */
        #preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: none;
            margin: 0 auto 20px auto;
            border: 2px solid #dee2e6;
        }

        /* Mensagem de Status */
        #status {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🛹 Controle de Acesso</h1>
        <p>Envie a foto do equipamento para verificação.</p>
        
        <label class="btn-upload">
            <input type="file" id="imageUpload" accept="image/*">
            📸 Escolher Imagem
        </label>
        
        <img id="preview" alt="Imagem analisada">
        
        <div id="status">⏳ Carregando a inteligência artificial...</div>
    </div>

    <script>
        // Caminho dos arquivos locais
        const modelURL = "./meu_modelo/model.json";
        const metadataURL = "./meu_modelo/metadata.json";

        let model, maxPredictions;

        // 1. Carrega o modelo ao abrir a página
        async function init() {
            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                document.getElementById("status").innerHTML = "✅ Sistema pronto! Aguardando imagem.";
            } catch (error) {
                document.getElementById("status").innerHTML = "❌ Erro ao carregar o modelo. Verifique a pasta './meu_modelo/'.";
                console.error(error);
            }
        }

        // 2. Lida com o upload da imagem
        document.getElementById('imageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const imgElement = document.getElementById('preview');
                
                // Reseta o visual da tela antes de analisar a nova imagem
                document.body.className = "";
                document.getElementById("status").innerHTML = "🔄 Analisando imagem...";
                
                // A ordem correta: primeiro diz o que fazer ao carregar, depois injeta a imagem.
                // Isso evita o erro da tela travada.
                imgElement.onload = function() {
                    predict(imgElement);
                };

                imgElement.src = e.target.result;
                imgElement.style.display = 'block'; 
            }
            
            reader.readAsDataURL(file);
        });

        // 3. Faz a previsão e toma a decisão
        async function predict(imageElement) {
            if (!model) {
                document.getElementById("status").innerHTML = "❌ O modelo ainda não carregou.";
                return;
            }

            try {
                const prediction = await model.predict(imageElement);
                
                let maiorProbabilidade = 0;
                let melhorClasse = "";

                // Descobre qual classe teve a maior pontuação
                for (let i = 0; i < maxPredictions; i++) {
                    if (prediction[i].probability > maiorProbabilidade) {
                        maiorProbabilidade = prediction[i].probability;
                        melhorClasse = prediction[i].className;
                    }
                }

                const statusDiv = document.getElementById("status");
                const limiteDeCerteza = 0.75; // Exige 75% de certeza para validar

                // LÓGICA DE DECISÃO EXATA:
                // Se tiver certeza E for Skate (Classe 2) -> Libera
                if (maiorProbabilidade > limiteDeCerteza && melhorClasse === "Classe 2") {
                    statusDiv.innerHTML = "🛹 Acesso Liberado! Boa sessão de skate.";
                    document.body.className = "acesso-liberado";
                } 
                // Se for Bike (Classe 1) OU não identificar com certeza nenhum dos dois -> Bloqueia
                else {
                    statusDiv.innerHTML = "❌ Acesso Negado! Pista exclusiva para Skates.";
                    document.body.className = "acesso-negado";
                }

            } catch (erro) {
                document.getElementById("status").innerHTML = "❌ Erro durante a análise.";
                console.error("Erro na predição:", erro);
            }
        }

        // Inicia o sistema
        init();
    </script>

</body>
</html>
